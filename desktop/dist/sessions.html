<!doctype html>
<!-- The Sessions window (#178): every daemon's agent sessions, grouped by
     daemon, sessions waiting for input first and sessions started by hand
     (outside itervox, read-only) last. The app pushes the data
     (src-tauri/src/sessions.rs push_script); choosing a session navigates to
     /__itervox/open-session, which the window intercepts and opens in that
     daemon's dashboard at /sessions?id=… ; "New session…" navigates to
     /__itervox/new-session and opens /sessions?new=1. Sessions in tmux carry
     a "tmux" badge; a daemon without tmux shows the install warning. No
     network access of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions — Itervox</title>
<!-- A system material behind the page (src-tauri/src/material.rs): mark
     <html> before the stylesheet applies, so the first paint is right. -->
<script>(function(){var m=window.__ITERVOX_MATERIAL__;if(m)document.documentElement.setAttribute("data-material",m);})();</script>
<link rel="stylesheet" href="theme.css">
<style>
  /* Layout only: colours, surfaces, radii and shadows come from theme.css. */
  body { font-size:14px; line-height:1.4; }
  header { position:sticky; top:10px; z-index:1; margin:10px 10px 0; padding:12px 18px; border-radius:var(--r-bar); }
  h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em; }
  #summary { color:var(--text2); margin-top:2px; font-size:13px; }
  main { padding:2px 10px 20px; }
  section { margin-top:10px; padding:14px 14px 10px; border-radius:var(--r-panel); }
  section > :last-child { margin-bottom:4px; }
  h2 { margin:0 0 8px 2px; font-size:15px; font-weight:600; }
  h2 .where { font-weight:400; font-size:13px; color:var(--muted); }
  .error { color:var(--err); margin:4px 2px; font-size:13px; }
  .empty { color:var(--muted); margin:4px 2px; font-size:13px; }
  button.session { display:flex; width:100%; gap:10px; align-items:center; text-align:left; cursor:pointer;
    min-height:44px; padding:8px 12px; margin:6px 0; font-size:13px; }
  button.session:hover { background:var(--card-hover); }
  button.session:focus { outline:2px solid var(--focus); outline-offset:2px; }
  button.session:focus:not(:focus-visible) { outline:none; }
  .id { font-family:var(--font-mono); font-weight:600; min-width:72px; }
  .meta { color:var(--text2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { border-radius:var(--r-pill); padding:2px 9px; font-size:12px; font-weight:600; white-space:nowrap;
    background:var(--warn-soft); color:var(--warn); }
  .status { color:var(--muted); font-size:12px; white-space:nowrap; }
  button.session.external { background:var(--card-faint); border-style:dashed; border-color:var(--dashed); box-shadow:none; }
  button.session.external .id { font-weight:500; color:var(--muted); }
  .origin { color:var(--muted); font-size:12px; font-style:italic; white-space:nowrap; }
  .tmux { border-radius:var(--r-pill); padding:1px 8px; font-size:11px; background:var(--hover);
    font-family:var(--font-mono); color:var(--text2); white-space:nowrap; }
  .tmux.controllable { background:var(--accent-soft); color:var(--accent-text); }
  .tmux-warning { background:var(--warn-soft); color:var(--warn); border-radius:var(--r-row); padding:8px 12px;
    margin:4px 0 6px; font-size:13px; }
  .tmux-warning code { font-family:var(--font-mono); }
  button.new-session { font-size:13px; min-height:32px; padding:0 14px; margin:0 0 4px; }
</style>
</head>
<body class="page">
<header class="glass">
  <h1>Sessions</h1>
  <div id="summary">Reading the daemons…</div>
</header>
<main id="groups" aria-label="Agent sessions by daemon"></main>
<script>
(function () {
  var OPEN_PATH = '/__itervox/open-session';
  var READY_PATH = '/__itervox/ready';
  var NEW_SESSION_PATH = '/__itervox/new-session';
  var groupsEl = document.getElementById('groups');
  var summaryEl = document.getElementById('summary');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buttons() {
    return Array.prototype.slice.call(document.querySelectorAll('button.session'));
  }

  function open(daemon, key) {
    window.location.href = OPEN_PATH + '?daemon=' + encodeURIComponent(daemon) +
      '&id=' + encodeURIComponent(key);
  }

  function newSession(daemon) {
    window.location.href = NEW_SESSION_PATH + '?daemon=' + encodeURIComponent(daemon);
  }

  function render(view) {
    var focused = document.activeElement && document.activeElement.dataset
      ? document.activeElement.dataset.ref : null;
    summaryEl.textContent = view.total === 0
      ? 'No agent sessions are running.'
      : view.total + ' session' + (view.total === 1 ? '' : 's') +
        (view.waiting > 0 ? ' · ' + view.waiting + ' waiting for input' : '') +
        (view.external > 0 ? ' · ' + view.external + ' started outside itervox' : '');
    groupsEl.textContent = '';
    view.groups.forEach(function (g) {
      var sec = el('section', 'glass');
      var h = el('h2', null, g.name + ' ');
      h.appendChild(el('span', 'where', '— ' + g.location));
      sec.appendChild(h);
      if (g.tmuxWarning) sec.appendChild(el('p', 'tmux-warning', g.tmuxWarning));
      if (g.newSession) {
        var ns = el('button', 'new-session chip', 'New session…');
        ns.type = 'button';
        ns.title = 'Start an agent in a new tmux session on this daemon';
        ns.addEventListener('click', function () { newSession(g.daemon); });
        sec.appendChild(ns);
      }
      if (g.error) sec.appendChild(el('p', 'error', g.error));
      else if (g.sessions.length === 0) sec.appendChild(el('p', 'empty', 'No sessions.'));
      g.sessions.forEach(function (s) {
        var external = s.owner === 'external';
        var b = el('button', external ? 'session card external' : 'session card');
        b.type = 'button';
        b.dataset.ref = g.daemon + '\n' + s.key;
        b.appendChild(el('span', 'id', s.label));
        var meta = external || s.kind === 'tmux'
          ? [s.cwd, s.backend].filter(Boolean).join(' · ')
          : [s.title, s.profile, s.backend, s.workerHost].filter(Boolean).join(' · ');
        b.appendChild(el('span', 'meta', meta || s.key));
        if (external) b.appendChild(el('span', 'origin', 'started outside itervox'));
        if (s.tmux) {
          var t = el('span', s.controllable ? 'tmux controllable' : 'tmux', 'tmux');
          t.title = (s.tmuxLabel ? 'tmux pane ' + s.tmuxLabel : 'tmux') +
            (s.controllable ? ' · controllable from the dashboard' : ' · read-only');
          b.appendChild(t);
        }
        if (s.status === 'input_required') b.appendChild(el('span', 'badge', 'needs input'));
        else b.appendChild(el('span', 'status', s.status.replace(/_/g, ' ')));
        b.title = s.status === 'input_required' && s.inputContext ? s.inputContext
          : external && s.inUseReason ? 'Still running outside itervox: ' + s.inUseReason
          : 'Open ' + s.label;
        b.addEventListener('click', function () { open(g.daemon, s.key); });
        sec.appendChild(b);
      });
      groupsEl.appendChild(sec);
    });
    var again = buttons().filter(function (b) { return b.dataset.ref === focused; })[0];
    if (again) again.focus();
  }

  // Arrow keys move between sessions across groups; Enter opens (native).
  document.addEventListener('keydown', function (e) {
    var list = buttons();
    if (list.length === 0) return;
    var i = list.indexOf(document.activeElement);
    var next = -1;
    if (e.key === 'ArrowDown') next = i < 0 ? 0 : Math.min(i + 1, list.length - 1);
    else if (e.key === 'ArrowUp') next = i < 0 ? 0 : Math.max(i - 1, 0);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = list.length - 1;
    if (next < 0) return;
    e.preventDefault();
    list[next].focus();
  });

  window.__itervoxSessions = render;
  // Ask the app for the current view (the navigation is intercepted).
  window.location.href = READY_PATH;
})();
</script>
</body>
</html>
