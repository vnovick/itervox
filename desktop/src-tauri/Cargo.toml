[package]
name = "itervox-desktop"
version = "0.2.5"
description = "Itervox menu-bar app: a thin Tauri shell over the itervox daemons"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
# The library holds the testable logic; the binary is a two-line main.
name = "itervox_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2.6"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback-only HTTP to the daemons: no TLS stack needed.
ureq = { version = "3", default-features = false, features = ["json"] }
getrandom = "0.3"
libc = "0.2"
# The OS credential store: the macOS Keychain, the Secret Service on Linux
# and the Windows Credential Manager; memory when none is reachable.
keyring = "4"
tauri-plugin-updater = "2"

# Linux and Windows (#260): the update check reads the latest GitHub
# release over HTTPS (no self-update there, only a link to the release).
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

# Windows (#260): process liveness, the user PATH for the command-line tool,
# and the registry Run key for Start at Login.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
