name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    # Release series branches (v0.2.2, …) carry stacked PRs; they need CI too.
    branches: [main, "v[0-9]*"]

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Build web assets
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web run build

      - name: Build
        run: go build ./cmd/... ./internal/...

      # -tags sshmatrix: the slow SSH login-shell matrix in internal/agent,
      # skipped by a plain `go test` (CORE-172). goleak.VerifyTestMain runs in
      # internal/agent, internal/server and internal/orchestrator (CORE-112).
      - name: Test (with race detector and coverage)
        run: go test -race -count=1 -timeout 20m -tags sshmatrix -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/...

      - name: Deploy script tests (fetch-secrets quoting, bootstrap dry-run)
        run: make deploy-test

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage gate (≥ 50%)
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 50) { print "Coverage " pct "% is below the 50% gate"; exit 1 } }'

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      # CORE-112: no production-unreachable function outside the reasoned
      # scripts/deadcode-allowlist.txt (deadcode is pinned in the script).
      - name: Dead code
        run: make deadcode


  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --build-tags dev ./cmd/... ./internal/...

  govulncheck:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run govulncheck
        run: govulncheck -tags dev ./cmd/... ./internal/...
