name: Desktop release

# The signed, notarized macOS release (#130): a universal Itervox.app (with
# the itervox daemon as its sidecar) in a .dmg, the universal `itervox` CLI
# in a .zip, the updater archive + latest.json the app updates from, and
# then the Homebrew cask in the tap (#244, notarized releases only).
#
# Called by release.yml after GoReleaser has created the GitHub release for
# the tag, and runnable by hand (Actions → Desktop release) to build and
# verify without publishing. Every step that needs a credential reads it
# from a secret by name; scripts never print them. Without the Apple
# secrets (a fork, a pull request, or not yet configured) the build still
# runs, unsigned, with a warning, and publishes no updater manifest.
# Required secrets and how to verify a build: docs/release-mac.md.
#
# The Linux (AppImage + .deb, x86_64 and arm64) and Windows (MSI + NSIS,
# x86_64) apps (#260) are built unsigned by the jobs below the Mac one and
# attached to the same release. They do not update themselves: the app links
# to the release page when a newer one exists. Windows bundles the native
# itervox.exe as its sidecar once the daemon builds for Windows (#259).

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and upload to (vX.Y.Z)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the build (default: tauri.conf.json); nothing is uploaded to a release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Sign · notarize · publish (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TAURI_DIR: desktop/src-tauri
      BUNDLE_DIR: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
      OUT: ${{ github.workspace }}/release-out
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(jq -r .version "$TAURI_DIR/tauri.conf.json")"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH[-PRERELEASE] version; the updater could not compare it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Itervox $version"

      # Decides signed vs unsigned from which secrets exist (their values
      # stay in the environment of this step only) and fails on a
      # half-configured set rather than shipping a broken release.
      - name: Decide signing mode
        id: mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash desktop/scripts/macos-release.sh mode "$TAURI_DIR/tauri.conf.json"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust (both Mac targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-release-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-release-${{ runner.os }}-

      # The dashboard, then the daemon for both architectures, lipo'd into
      # binaries/itervox-universal-apple-darwin (the sidecar of a universal
      # app build, and the standalone CLI).
      - name: Build the universal daemon
        run: |
          make desktop-sidecar
          lipo -archs "$TAURI_DIR/binaries/itervox-universal-apple-darwin"

      - name: Install the Tauri CLI
        run: make desktop-tauri-cli

      - name: Import the signing certificate
        if: steps.mode.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash desktop/scripts/macos-release.sh import-cert

      # --- the standalone CLI ------------------------------------------------

      - name: Sign the CLI
        if: steps.mode.outputs.sign == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p "$OUT/cli"
          cp "$TAURI_DIR/binaries/itervox-universal-apple-darwin" "$OUT/cli/itervox"
          bash desktop/scripts/macos-release.sh sign "$OUT/cli/itervox" dev.itervox.cli

      - name: Package the CLI unsigned
        if: steps.mode.outputs.sign != 'true'
        run: |
          mkdir -p "$OUT/cli"
          cp "$TAURI_DIR/binaries/itervox-universal-apple-darwin" "$OUT/cli/itervox"

      - name: Zip the CLI
        id: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.mode.outputs.sign }}
        run: |
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-unsigned"
          zip="$OUT/itervox_${VERSION}_darwin_universal${suffix}.zip"
          ditto -c -k "$OUT/cli/itervox" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Notarize the CLI
        if: steps.mode.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ZIP: ${{ steps.cli.outputs.zip }}
        run: bash desktop/scripts/macos-release.sh notarize "$ZIP"

      - name: Verify the CLI signature
        if: steps.mode.outputs.sign == 'true'
        run: bash desktop/scripts/macos-release.sh verify-cli "$OUT/cli/itervox"

      # --- the app -----------------------------------------------------------

      # Tauri signs the sidecar and the app with the hardened runtime and
      # Entitlements.plist when APPLE_SIGNING_IDENTITY is set (the keychain
      # is the temporary one imported above). Notarization is done below, so
      # no notarization credentials reach this step. The version is stamped
      # from the tag so the updater compares the right numbers.
      - name: Build the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.mode.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then unset APPLE_SIGNING_IDENTITY; fi
          cd "$TAURI_DIR"
          cargo tauri build --target universal-apple-darwin --bundles app \
            --config "{\"version\":\"$VERSION\"}"
          test -x "target/universal-apple-darwin/release/bundle/macos/Itervox.app/Contents/MacOS/itervox"

      - name: Notarize and staple the app
        if: steps.mode.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$OUT"
          ditto -c -k --keepParent "$BUNDLE_DIR/Itervox.app" "$OUT/Itervox-notarize.zip"
          bash desktop/scripts/macos-release.sh notarize "$OUT/Itervox-notarize.zip"
          rm "$OUT/Itervox-notarize.zip"
          bash desktop/scripts/macos-release.sh staple "$BUNDLE_DIR/Itervox.app"

      - name: Verify the app signature (codesign --verify --deep --strict)
        if: steps.mode.outputs.sign == 'true'
        run: codesign --verify --deep --strict --verbose=2 "$BUNDLE_DIR/Itervox.app"

      - name: Verify Gatekeeper accepts the app (spctl --assess)
        if: steps.mode.outputs.notarize == 'true'
        run: bash desktop/scripts/macos-release.sh verify-app "$BUNDLE_DIR/Itervox.app"

      - name: Build the disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.mode.outputs.sign }}
          APPLE_SIGNING_IDENTITY: ${{ steps.mode.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-unsigned"
          dmg="$OUT/Itervox_${VERSION}_universal${suffix}.dmg"
          bash desktop/scripts/macos-release.sh make-dmg "$BUNDLE_DIR/Itervox.app" "$dmg"
          if [ "$SIGNED" = "true" ]; then
            bash desktop/scripts/macos-release.sh sign "$dmg" dev.itervox.desktop.dmg
          fi
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize, staple and verify the disk image
        if: steps.mode.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          bash desktop/scripts/macos-release.sh notarize "$DMG"
          bash desktop/scripts/macos-release.sh staple "$DMG"
          bash desktop/scripts/macos-release.sh verify-dmg "$DMG"

      # --- the updater -------------------------------------------------------

      - name: Release notes
        if: steps.mode.outputs.updater == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {inside=1; next}
            inside && /^## \[/ {exit}
            inside {print}
          ' CHANGELOG.md > "$OUT/notes.md"
          echo "Release notes: $(wc -l < "$OUT/notes.md") lines"

      # The archive is made from the stapled app, then signed with the
      # updater key; the app verifies that signature against the public key
      # in tauri.conf.json before installing.
      - name: Build and sign the updater archive and latest.json
        if: steps.mode.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag || format('v{0}', steps.version.outputs.version) }}
          REPO: ${{ github.repository }}
        run: |
          archive="$OUT/Itervox_${VERSION}_universal.app.tar.gz"
          bash desktop/scripts/macos-release.sh updater-archive "$BUNDLE_DIR/Itervox.app" "$archive"
          (cd "$TAURI_DIR" && cargo tauri signer sign "$archive")
          test -s "$archive.sig"
          bash desktop/scripts/gen-latest-json.sh \
            --version "$VERSION" \
            --url "https://github.com/$REPO/releases/download/$TAG/$(basename "$archive")" \
            --signature-file "$archive.sig" \
            --notes-file "$OUT/notes.md" \
            --out "$OUT/latest.json"
          rm -f "$OUT/notes.md"

      - name: Remove the temporary keychain
        if: always()
        run: bash desktop/scripts/macos-release.sh delete-keychain

      - name: List the release files
        run: ls -la "$OUT"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: itervox-macos-universal-${{ steps.version.outputs.version }}
          path: |
            release-out/*.dmg
            release-out/*.zip
            release-out/*.app.tar.gz
            release-out/*.app.tar.gz.sig
            release-out/latest.json
          if-no-files-found: error
          retention-days: 30

      # latest.json goes up last: the moment it is published, installed
      # apps are offered the archive it points at, so everything it
      # references must already be there.
      - name: Upload to the GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=("$OUT"/*.dmg "$OUT"/*.zip "$OUT"/*.app.tar.gz "$OUT"/*.app.tar.gz.sig)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f "$OUT/latest.json" ]; then
            gh release upload "$TAG" "$OUT/latest.json" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      # --- the Homebrew cask -------------------------------------------------

      # Casks/itervox-app.rb in the tap that holds the CLI formula (#244), with
      # this version and the DMG's SHA-256. It runs only for a notarized
      # build (a failed notarization fails the job before this step) and
      # after the DMG is on the release, so `brew install --cask` never
      # points at a missing or unsigned file. Without the signing secrets
      # the step is skipped, and the script skips again without the tap
      # token or for a pre-release.
      - name: Update the Homebrew cask
        if: inputs.tag != '' && steps.mode.outputs.notarize == 'true'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZED: ${{ steps.mode.outputs.notarize }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          REPO: ${{ github.repository }}
        run: |
          bash desktop/scripts/homebrew-cask.sh render \
            --version "$VERSION" --dmg "$DMG" --repo "$REPO" --out "$OUT/itervox-app.rb"
          bash desktop/scripts/homebrew-cask.sh publish \
            --cask "$OUT/itervox-app.rb" --version "$VERSION" --notarized "$NOTARIZED"

  linux:
    name: Build · publish (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TAURI_DIR: desktop/src-tauri
      BUNDLE_DIR: desktop/src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(jq -r .version "$TAURI_DIR/tauri.conf.json")"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH[-PRERELEASE] version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils file

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-release-${{ runner.os }}-${{ runner.arch }}-

      # The dashboard, then the daemon for this runner's architecture
      # (binaries/itervox-<triple>, the sidecar).
      - name: Build the daemon
        run: make desktop-sidecar

      - name: Install the Tauri CLI
        run: make desktop-tauri-cli

      - name: Build the AppImage and .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$TAURI_DIR"
          cargo tauri build --bundles appimage,deb --config "{\"version\":\"$VERSION\"}"

      - name: Check that the AppImage carries the daemon
        run: |
          appimage="$(ls "$BUNDLE_DIR"/appimage/*.AppImage)"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/itervox"
          "$RUNNER_TEMP/squashfs-root/usr/bin/itervox" --version

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: itervox-linux-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload to the GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=("$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/deb/*.deb)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Build · publish (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAURI_DIR: desktop/src-tauri
      BUNDLE_DIR: desktop/src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(jq -r .version "$TAURI_DIR/tauri.conf.json")"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH[-PRERELEASE] version"
            exit 1
          fi
          # MSI versions are numeric only: a prerelease with letters ships
          # the NSIS installer alone.
          bundles="msi,nsis"
          if [[ "$version" == *-* ]] && ! [[ "${version#*-}" =~ ^[0-9]+$ ]]; then
            bundles="nsis"
            echo "::notice::$version is a prerelease with letters; MSI needs a numeric version, so only the NSIS installer is built"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundles=$bundles" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-release-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-release-${{ runner.os }}-

      - name: Build the sidecar when the daemon builds for Windows
        id: sidecar
        run: bash desktop/scripts/windows-sidecar.sh

      - name: Install the Tauri CLI
        run: |
          version="$(sed -n 's/^TAURI_CLI_VERSION := //p' Makefile)"
          cargo tauri --version 2>/dev/null | grep -qx "tauri-cli $version" \
            || cargo install tauri-cli --version "$version" --locked

      - name: Build the installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLES: ${{ steps.version.outputs.bundles }}
          SIDECAR_CONFIG: ${{ steps.sidecar.outputs.config }}
        run: |
          cd "$TAURI_DIR"
          args=(--bundles "$BUNDLES" --config "{\"version\":\"$VERSION\"}")
          if [ -n "$SIDECAR_CONFIG" ]; then args+=(--config "$SIDECAR_CONFIG"); fi
          cargo tauri build "${args[@]}"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: itervox-windows-x86_64-${{ steps.version.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload to the GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=("$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/nsis/*.exe)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
