name: Chaos

# #126: run the orchestrator and tracker tests over and over while busy loops
# saturate the runner's CPUs (`make chaos`). The orchestrator's ordering races
# showed up only intermittently under load, so a normal single CI run lands
# them green. Nightly on the default branch, on demand, and on a pull request
# labelled `ci:chaos`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Runs per CPU setting (-count)"
        default: "10"
      run:
        description: "Test name regex (-run)"
        default: "."
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    branches: [main, "v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: Chaos (tests under CPU saturation)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:chaos')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Some test binaries link internal/server, which embeds web/dist.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Build web assets
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web run build

      - name: make chaos
        env:
          CHAOS_COUNT: ${{ inputs.count || '10' }}
          CHAOS_RUN: ${{ inputs.run || '.' }}
          CHAOS_OUT: chaos-out
        run: make chaos

      # A failing package keeps its verbose log; a hung test's timeout panic
      # in that log carries every goroutine's stack.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: chaos-out/*.log
          if-no-files-found: ignore
          retention-days: 14
