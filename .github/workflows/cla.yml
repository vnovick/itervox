name: CLA

# Contributor License Agreement check for EXTERNAL contributions, run by
# contributor-assistant/github-action ("CLA Assistant Lite"). A contributor
# signs once by commenting the exact sign phrase on their pull request; the
# signature is recorded in signatures/cla.json on the dedicated
# `cla-signatures` branch (never on main). Individual terms: CLA.md;
# companies: CLA-CORPORATE.md. See CONTRIBUTING.md#contributor-license-agreement-cla.
#
# Scope — the job runs only for external contributions:
#   pull_request_target: the PR comes from a fork (head repo != this repo)
#     AND its author is not allowlisted (vnovick, claude, any `*[bot]`).
#     Maintainer branches pushed to vnovick/itervox itself — including the
#     stacked release PRs — are skipped, so no in-repo PR turns red.
#   issue_comment: only the exact sign phrase or `recheck`, only on a pull
#     request, and the `origin` step below re-applies the same fork/allowlist
#     test (an issue_comment payload does not carry the PR's head repo).
# The action's own `allowlist` repeats the author allowlist for co-authors /
# individual committers inside a fork PR.
# A skipped job reports "Skipped", which GitHub treats as passing for a
# required status check.
#
# Safety: pull_request_target and issue_comment run in the base repo's context
# with a write token, which is why the action needs them (it comments, sets a
# status and commits signatures). This workflow therefore NEVER checks out or
# runs code from the pull request: there is no actions/checkout step, and
# nothing from the PR (title, body, branch name, comment text) is interpolated
# into a shell command — the comment body is only compared in `if:`
# expressions, and the PR number is passed to the step through `env:`.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA signed
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name != github.repository
        && !contains(fromJSON('["vnovick", "claude"]'), github.event.pull_request.user.login)
        && !endsWith(github.event.pull_request.user.login, '[bot]'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # As documented by the action: it comments on the PR, sets the commit
    # status, commits signatures to the cla-signatures branch and re-runs the
    # pull_request_target run after a sign comment.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Skip in-repo and allowlisted PRs (issue_comment)
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh api "repos/$BASE_REPO/pulls/$PR_NUMBER")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")
          author=$(jq -r '.user.login' <<< "$pr")
          external=true
          if [ "$head_repo" = "$BASE_REPO" ]; then
            echo "PR branch lives in $BASE_REPO (maintainer branch): CLA not required."
            external=false
          fi
          case "$author" in
            vnovick | claude | *'[bot]')
              echo "PR author $author is allowlisted: CLA not required."
              external=false
              ;;
          esac
          echo "external=$external" >> "$GITHUB_OUTPUT"

      - name: CLA Assistant
        if: steps.origin.outputs.external == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/vnovick/itervox/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Dedicated, unprotected branch so signature commits never touch main.
          branch: cla-signatures
          allowlist: vnovick,dependabot[bot],github-actions[bot],claude,*[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            <br/>Thank you for your contribution! Before we can merge it, we ask
            that $you sign the [Itervox Individual Contributor License Agreement](https://github.com/vnovick/itervox/blob/main/CLA.md).
            You keep the copyright in your work; the CLA grants the project owner a license to use and
            relicense it. You only need to sign once, by posting a comment with exactly the text below.
            Contributing on behalf of your employer? See the
            [Corporate CLA](https://github.com/vnovick/itervox/blob/main/CLA-CORPORATE.md) as well.<br/>
          create-file-commit-message: "chore(cla): create CLA signatures file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in $owner/$repo"
          lock-pullrequest-aftermerge: true
