name: Desktop CI

# The desktop app (#128, desktop/): Rust gates, the end-to-end tests
# against the real daemon, and unsigned bundles, on macOS, Linux (#260:
# AppImage + .deb, x86_64 and arm64) and Windows (#260: MSI + NSIS, x86_64).
# Releases are built by desktop-release.yml (#130).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  pull_request:
    # Release series branches (v0.2.2, …) carry stacked PRs; they need CI too.
    branches: [main, "v[0-9]*"]
    paths:
      - "desktop/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  macos:
    name: Test · Unsigned bundle (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-

      # fmt + clippy -D warnings + unit tests + the end-to-end tests that
      # start, list, read and stop a real daemon built for this runner.
      - name: Test
        run: make desktop-test

      - name: Build the unsigned app
        run: make desktop

      # upload-artifact drops file modes, so the .app goes in a ditto zip.
      - name: Package the app bundle
        run: |
          cd desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Itervox.app Itervox.app.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: itervox-desktop-macos-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/Itervox.app.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Test · Unsigned bundles (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # WebKitGTK, GTK and AppIndicator (the tray) for Tauri; xdg-utils and
      # file for the AppImage bundler.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils file

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-

      # fmt + clippy -D warnings + unit tests + the end-to-end tests against
      # a real daemon built for this runner.
      - name: Test
        run: make desktop-test

      - name: Build the unsigned AppImage and .deb
        run: make desktop

      # The AppImage must carry the daemon as its sidecar.
      - name: Check the bundles
        run: |
          cd desktop/src-tauri/target/release/bundle
          ls -la appimage deb
          appimage="$(ls appimage/*.AppImage)"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/desktop/src-tauri/target/release/bundle/$appimage" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/itervox"
          "$RUNNER_TEMP/squashfs-root/usr/bin/itervox" --version
          listing="$(dpkg-deb -c deb/*.deb)"
          if ! grep -q '/usr/bin/itervox$' <<<"$listing"; then
            echo "::error::the .deb has no /usr/bin/itervox"
            printf '%s\n' "$listing"
            exit 1
          fi

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: itervox-desktop-linux-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Test · Unsigned installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-

      # The Unix-only end-to-end tests (shell-script stand-ins, signals)
      # are compiled out here; the unit tests cover every platform.
      - name: Format, lint, test
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # A native itervox.exe (#259) becomes the sidecar as soon as the daemon
      # builds for Windows; until then the app ships without a local daemon
      # and says that local projects need WSL or a remote daemon.
      - name: Build the sidecar when the daemon builds for Windows
        id: sidecar
        run: bash desktop/scripts/windows-sidecar.sh

      - name: Install the Tauri CLI
        run: |
          version="$(sed -n 's/^TAURI_CLI_VERSION := //p' Makefile)"
          cargo tauri --version 2>/dev/null | grep -qx "tauri-cli $version" \
            || cargo install tauri-cli --version "$version" --locked

      - name: Build the unsigned MSI and NSIS installers
        working-directory: desktop/src-tauri
        env:
          SIDECAR_CONFIG: ${{ steps.sidecar.outputs.config }}
        run: |
          bundles="msi,nsis"
          args=(--bundles "$bundles")
          if [ -n "$SIDECAR_CONFIG" ]; then args+=(--config "$SIDECAR_CONFIG"); fi
          cargo tauri build "${args[@]}"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: itervox-desktop-windows-x86_64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
