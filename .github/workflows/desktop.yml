name: Desktop CI

# The macOS menu-bar app (#128, desktop/): Rust gates, the end-to-end tests
# against the real daemon, and an unsigned app bundle. Signed, notarized
# releases are built by desktop-release.yml (#130).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  pull_request:
    # Release series branches (v0.2.2, …) carry stacked PRs; they need CI too.
    branches: [main, "v[0-9]*"]
    paths:
      - "desktop/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  macos:
    name: Test · Unsigned bundle (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Makefile') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-

      # fmt + clippy -D warnings + unit tests + the end-to-end tests that
      # start, list, read and stop a real daemon built for this runner.
      - name: Test
        run: make desktop-test

      - name: Build the unsigned app
        run: make desktop

      # upload-artifact drops file modes, so the .app goes in a ditto zip.
      - name: Package the app bundle
        run: |
          cd desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Itervox.app Itervox.app.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: itervox-desktop-macos-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/Itervox.app.zip
          if-no-files-found: error
          retention-days: 14
