name: Action

# #252: tests of the composite action in action/ (`uses: vnovick/itervox/action@<ref>`).
# actionlint checks this workflow, and through the dry-run job's
# `uses: ./action`, the action's inputs; shellcheck and the trust-check
# script test cover action/*.sh; the dry run installs a release binary with
# its checksum verified. Fork-safe: `pull_request`, a read-only token, no
# secrets, nothing published.
on:
  pull_request:
    paths:
      - 'action/**'
      - '.github/workflows/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: actionlint, shellcheck, trust-check test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color=false .github/workflows/action.yml
      - name: shellcheck
        run: shellcheck -x action/*.sh
      - name: trust-check test
        run: bash action/trust-check_test.sh

  dry-run:
    name: dry run of the action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: itervox
        uses: ./action
        with:
          issue: '1'
          agent: none
          dry-run: 'true'
      - name: outputs
        env:
          STATUS: ${{ steps.itervox.outputs.status }}
        run: test "$STATUS" = dry_run
