version: 2

before:
  hooks:
    - go mod tidy
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: itervox
    main: ./cmd/itervox
    binary: itervox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # The standalone CI referee (cmd/referee, the same code as `itervox
  # referee`), shipped as its own archive and Homebrew formula so
  # `brew install vnovick/tap/referee` installs only the referee.
  - id: referee
    main: ./cmd/referee
    binary: referee
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  # The itervox archives (itervox_<os>_<arch>) hold only the itervox build:
  # action/install.sh, deploy/bootstrap.sh, deploy/upgrade.sh and the
  # terraform startup script fetch them by this exact name.
  - id: default
    ids:
      - itervox
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # Windows (#259) ships itervox.exe in a zip; the Homebrew formula below
    # only picks the darwin and linux tar.gz archives.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # CORE-064: ship deploy/ in the release archives with its tree intact —
    # bootstrap.sh resolves systemd/itervox.service, caddy/Caddyfile and
    # lib/fetch-secrets.sh relative to itself. A bare glob keeps each file's
    # path; strip_parent would flatten the tree and silently drop the
    # same-named files (the three provision.sh, the two README.md).
    # `files:` replaces GoReleaser's defaults, so LICENSE/README/CHANGELOG
    # are listed again.
    files:
      - deploy/**
      - LICENSE
      - README.md
      - CHANGELOG.md

  # The standalone referee archives (referee_<os>_<arch>): only the referee
  # binary plus LICENSE and README — no deploy/ tree, which is itervox's.
  - id: referee
    ids:
      - referee
    name_template: "referee_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

# One checksums.txt lists every archive (itervox_* and referee_*); its
# consumers look their archive up by exact file name.
checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      # No trailing colon: `chore foo` and `chore: foo` are both noise.
      - '^chore'
      - Merge pull request
      - Merge branch

brews:
  - name: itervox
    # Only the itervox archives: without this the formula would also see the
    # referee archives for the same OS/arch.
    ids:
      - default
    repository:
      owner: vnovick
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/vnovick/itervox"
    description: "Autonomous AI agent daemon that drives Linear issues through Claude/Codex-powered agentic loops."
    license: "Apache-2.0"
    install: |
      bin.install "itervox"
    test: |
      system "#{bin}/itervox", "--version"
  - name: referee
    ids:
      - referee
    repository:
      owner: vnovick
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://itervox.dev/guides/referee/"
    description: "CI referee for coding agents: an agent may change what CI checks, never how CI checks."
    license: "Apache-2.0"
    install: |
      bin.install "referee"
    test: |
      system "#{bin}/referee", "--version"
