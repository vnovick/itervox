version: 2

before:
  hooks:
    - go mod tidy
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: itervox
    main: ./cmd/itervox
    binary: itervox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # CORE-064: ship deploy/ in the release archives with its tree intact —
    # bootstrap.sh resolves systemd/itervox.service, caddy/Caddyfile and
    # lib/fetch-secrets.sh relative to itself. A bare glob keeps each file's
    # path; strip_parent would flatten the tree and silently drop the
    # same-named files (the three provision.sh, the two README.md).
    # `files:` replaces GoReleaser's defaults, so LICENSE/README/CHANGELOG
    # are listed again.
    files:
      - deploy/**
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      # No trailing colon: `chore foo` and `chore: foo` are both noise.
      - '^chore'
      - Merge pull request
      - Merge branch

brews:
  - name: itervox
    repository:
      owner: vnovick
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/vnovick/itervox"
    description: "Autonomous AI agent daemon that drives Linear issues through Claude/Codex-powered agentic loops."
    license: "Apache-2.0"
    install: |
      bin.install "itervox"
    test: |
      system "#{bin}/itervox", "--version"
