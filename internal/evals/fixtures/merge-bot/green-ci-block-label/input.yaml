# Scenario: green CI and approval, but the PR carries a block-list label.
# The bot must refuse, naming the label, and must never call merge_pr.
# (The daemon-side merge_pr gate also enforces this at action time; the
# scenario locks the prompt-level pre-check that gives the operator a
# precise refusal comment.)
issue:
  identifier: ENG-52
  state: In Review
  title: Green CI but needs-human label
  body: |
    All checks green, reviewer approved, but the PR is labeled needs-human —
    a default merge-bot block-list entry.
  branch_name: feat/eng-52-block-label
comment:
  body: "AI review passed — ready for merge"
pr:
  number: 52
  labels:
    - needs-human
