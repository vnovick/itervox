# Scenario: reviewer's hard checks fail. It must post a numbered failure
# list, move the issue back to In Progress, and must NOT emit the approval
# marker or merge anything. The no-marker property is an absence check:
# expected.yaml lists "/ai-approved" under forbidden_phrases (#189).
issue:
  identifier: ENG-62
  state: In Review
  title: PR with failing review checks
  body: |
    The diff includes an unrelated schema migration and is missing tests
    for the new error path.
  branch_name: feat/eng-62-failures
pr:
  number: 62
  diff: |
    diff --git a/db/migrations/0042_add_audit_table.sql b/db/migrations/0042_add_audit_table.sql
    new file mode 100644
    --- /dev/null
    +++ b/db/migrations/0042_add_audit_table.sql
    @@ -0,0 +1,3 @@
    +CREATE TABLE audit_log (id SERIAL PRIMARY KEY, event TEXT NOT NULL);
    +-- unrelated to ENG-62
    +ALTER TABLE users ADD COLUMN audit_id INT;
    diff --git a/src/storyExport.ts b/src/storyExport.ts
    --- a/src/storyExport.ts
    +++ b/src/storyExport.ts
    @@ -10,6 +10,11 @@ export function exportStory(story: Story): string {
    +  if (!story.pages.length) {
    +    throw new ExportError("story has no pages");
    +  }
       return render(story);
     }
