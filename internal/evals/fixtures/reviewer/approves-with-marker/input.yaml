# Scenario: reviewer's hard checks pass. The producer side of the merge
# handshake: it must leave the approval marker for the merge sweep
# (a GitHub review whose body contains exactly "/ai-approved") AND post the
# human-readable Linear approval comment. It must never merge or move state
# itself on the approve path.
issue:
  identifier: ENG-61
  state: In Review
  title: Clean PR ready for approval
  body: |
    Implementation matches the issue, CI is green, no security findings.
  branch_name: feat/eng-61-clean
pr:
  number: 61
  diff: |
    diff --git a/src/slugify.ts b/src/slugify.ts
    --- a/src/slugify.ts
    +++ b/src/slugify.ts
    @@ -1,3 +1,4 @@
     export function slugify(s: string): string {
    -  return s.toLowerCase();
    +  return s.toLowerCase().trim().replace(/\s+/g, "-");
     }
    diff --git a/src/slugify.test.ts b/src/slugify.test.ts
    --- a/src/slugify.test.ts
    +++ b/src/slugify.test.ts
    @@ -4,3 +4,6 @@ test("lowercases", () => {
    +test("collapses whitespace into dashes", () => {
    +  expect(slugify("  Hello  World ")).toBe("hello-world");
    +});
