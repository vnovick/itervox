# referee for GitLab CI. Copy these jobs into .gitlab-ci.yml (or keep the
# file elsewhere and `include:` it; see "Keep the pipeline outside the
# branch" below).
#
# In every merge request pipeline the `referee` job installs a pinned
# referee release (its SHA-256 checked against the release's checksums.txt
# and against REFEREE_SHA256), fetches the target branch, and runs
# `referee lanes` and `referee audit` on the merge request's changes. The
# policy (.referee.yml) is read from the target branch, never from the merge
# request. The result, with the same exit codes as the referee GitHub
# Action:
#
#   exit 0   auto lane, no audit findings: the `referee-approval` child
#            pipeline runs one job that passes.
#   exit 10  second_opinion lane: reported, passes like exit 0
#            (REFEREE_FAIL_ON: second_opinion fails the job with 10).
#   exit 20  human lane, or audit found weakened checks: the child pipeline
#            waits on the manual `approve-pipeline-change` job, so the merge
#            request's pipeline does not succeed until a maintainer runs it.
#            REFEREE_APPROVAL: none fails the job with 20 instead, like the
#            Action's default.
#   exit 2   any error (a base that cannot be fetched, a malformed policy, a
#            checksum mismatch): the job fails. Never approvable.
#
# Set up:
# - Settings > Merge requests: turn on "Pipelines must succeed".
# - Settings > CI/CD > Protected environments: protect `pipeline-approval`
#   and allow only maintainers to deploy to it. Only they can then run the
#   manual job. Without it anyone who can run pipeline jobs can approve,
#   the agent's token included: never let that token run jobs in this
#   environment.
# - Keep the pipeline outside the branch. .gitlab-ci.yml is in referee's
#   default human lane, but it is also the file that defines this job, so a
#   merge request that deletes the job is never judged. Point Settings >
#   CI/CD > CI/CD configuration file at a file in a project the agent cannot
#   push to (for example `ci/main.yml@my-group/ci-config`), or give
#   .gitlab-ci.yml code owners who must review every change to it.
# - Pin the image by digest in real use, and update REFEREE_VERSION and
#   REFEREE_SHA256 together (both from the release's checksums.txt).
# - Keep the `workflow: rules` below (merge them into yours if your
#   .gitlab-ci.yml already has a `workflow:`; a `workflow:` in an included
#   file applies to the whole pipeline).

# Run merge request pipelines, and no branch pipeline for a branch that has
# an open merge request. Without this a push to such a branch also starts a
# branch pipeline, which has no `referee` job (it runs only in merge request
# pipelines); when the branch pipeline is the latest one for the head
# commit, GitLab can take it as the merge request's head pipeline, and
# "Pipelines must succeed" passes without referee. Branches without a merge
# request (the default branch, say) still get branch pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - referee
  - referee-approval

referee:
  stage: referee
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0" # the merge base needs the history
    REFEREE_VERSION: "0.3.3"
    # referee_linux_amd64.tar.gz in v0.3.3's checksums.txt
    # (referee_linux_arm64.tar.gz: 0573b6cbc8e00393bafa1edd0542d31fa2ac81427890aaba150da4d46e7fa87f).
    REFEREE_SHA256: "81718e5be5bfabcc2fdff4ce0e4052371dda3c36df87b70bc4660d581b7d820d"
    REFEREE_FAIL_ON: human # human, second_opinion or never (report only)
    REFEREE_APPROVAL: step # step (the manual job) or none (fail with 20)
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      referee_base_branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?run the referee job in merge request pipelines}

      # >>> referee install (keep in sync across referee/ci/*.yml)
      set -eu
      : "${REFEREE_VERSION:?set REFEREE_VERSION, a referee release such as 0.3.3}"
      : "${REFEREE_SHA256:?set REFEREE_SHA256, the archive line of the release checksums.txt}"
      case $(uname -s) in
        Linux) referee_os=linux ;;
        Darwin) referee_os=darwin ;;
        *) echo "referee: unsupported OS $(uname -s)" >&2; exit 2 ;;
      esac
      case $(uname -m) in
        x86_64 | amd64) referee_arch=amd64 ;;
        aarch64 | arm64) referee_arch=arm64 ;;
        *) echo "referee: unsupported architecture $(uname -m)" >&2; exit 2 ;;
      esac
      referee_asset="referee_${referee_os}_${referee_arch}.tar.gz"
      referee_url="${REFEREE_DOWNLOAD_URL:-https://github.com/vnovick/itervox/releases/download}/v${REFEREE_VERSION#v}"
      referee_dir=$(mktemp -d) || exit 2
      curl -fsSL --retry 3 -o "$referee_dir/$referee_asset" "$referee_url/$referee_asset" || exit 2
      curl -fsSL --retry 3 -o "$referee_dir/checksums.txt" "$referee_url/checksums.txt" || exit 2
      referee_listed=$(awk -v f="$referee_asset" '$2 == f || $2 == "*" f { print $1 }' "$referee_dir/checksums.txt")
      if command -v sha256sum >/dev/null 2>&1; then
        referee_got=$(sha256sum "$referee_dir/$referee_asset" | awk '{ print $1 }')
      else
        referee_got=$(shasum -a 256 "$referee_dir/$referee_asset" | awk '{ print $1 }')
      fi
      if [ "$referee_listed" != "$REFEREE_SHA256" ] || [ "$referee_got" != "$REFEREE_SHA256" ]; then
        echo "referee: $referee_asset: checksums.txt lists '$referee_listed', the download is $referee_got, REFEREE_SHA256 is $REFEREE_SHA256" >&2
        exit 2
      fi
      tar -xzf "$referee_dir/$referee_asset" -C "$referee_dir" referee || exit 2
      PATH="$referee_dir:$PATH"
      referee --version
      # <<< referee install

      # >>> referee fetch base (keep in sync across referee/ci/*.yml)
      case $referee_base_branch in
        '' | -* | *..*) echo "referee: invalid base branch '$referee_base_branch'" >&2; exit 2 ;;
      esac
      if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
        git fetch --quiet --no-tags --unshallow origin || exit 2
      fi
      git fetch --quiet --no-tags origin "+refs/heads/$referee_base_branch:refs/remotes/origin/$referee_base_branch" ||
        { echo "referee: cannot fetch the base branch '$referee_base_branch' from origin" >&2; exit 2; }
      referee_base="origin/$referee_base_branch"
      # <<< referee fetch base

      referee_code=0
      (
        # >>> referee check (keep in sync across referee/ci/*.yml): exits like the referee GitHub Action
        referee_fail_on=${REFEREE_FAIL_ON:-human}
        case $referee_fail_on in
          human | second_opinion | never) ;;
          *) echo "referee: REFEREE_FAIL_ON must be human, second_opinion or never (got '$referee_fail_on')" >&2; exit 2 ;;
        esac
        referee_lanes=0
        referee lanes --base "$referee_base" --policy "${REFEREE_POLICY:-.referee.yml}" || referee_lanes=$?
        referee_audit=0
        referee audit --base "$referee_base" || referee_audit=$?
        echo "referee: lanes exit $referee_lanes, audit exit $referee_audit"
        case $referee_lanes in
          0 | 10 | 20) ;;
          *) echo "referee: lanes failed (exit $referee_lanes)" >&2; exit "$referee_lanes" ;;
        esac
        case $referee_audit in
          0 | 20) ;;
          *) echo "referee: audit failed (exit $referee_audit)" >&2; exit "$referee_audit" ;;
        esac
        if [ "$referee_fail_on" != never ]; then
          if [ "$referee_lanes" = 20 ] || [ "$referee_audit" = 20 ]; then
            echo "referee: this change touches how CI checks (human lane, or weakened checks): a maintainer must approve it" >&2
            exit 20
          fi
          if [ "$referee_lanes" = 10 ] && [ "$referee_fail_on" = second_opinion ]; then
            echo "referee: second_opinion lane" >&2
            exit 10
          fi
        fi
        exit 0
        # <<< referee check
      ) || referee_code=$?

      case ${REFEREE_APPROVAL:-step} in
        step | none) ;;
        *) echo "referee: REFEREE_APPROVAL must be step or none (got '$REFEREE_APPROVAL')" >&2; exit 2 ;;
      esac
      case $referee_code in
        0)
          cat >referee-approval.yml <<'YAML'
      referee-passed:
        image: alpine:3.20
        variables:
          GIT_STRATEGY: none
        script:
          - echo "referee: no pipeline change, no approval needed"
      YAML
          ;;
        20)
          [ "${REFEREE_APPROVAL:-step}" = step ] || exit 20
          cat >referee-approval.yml <<'YAML'
      approve-pipeline-change:
        image: alpine:3.20
        when: manual
        allow_failure: false
        environment:
          name: pipeline-approval
        variables:
          GIT_STRATEGY: none
        script:
          - echo "referee: pipeline change approved by $GITLAB_USER_LOGIN"
      YAML
          echo "referee: run the manual approve-pipeline-change job in the referee-approval child pipeline to approve"
          ;;
        *) exit "$referee_code" ;;
      esac
  artifacts:
    paths:
      - referee-approval.yml
    expire_in: 1 week

# The child pipeline the referee job wrote: one passing job, or the manual
# approval. strategy: depend makes this job (and so the merge request's
# pipeline) wait for it.
referee-approval:
  stage: referee-approval
  needs:
    - referee
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  trigger:
    include:
      - artifact: referee-approval.yml
        job: referee
    strategy: depend
