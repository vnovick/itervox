name: referee
description: >-
  Keep coding agents from changing how CI checks their work: classify a pull
  request's files into human / second_opinion / auto lanes (policy read from
  the base branch), audit it for weakened checks, pin a policy hash, or
  verify signed check records.
author: vnovick
branding:
  icon: shield
  color: purple

inputs:
  mode:
    description: lanes, audit, pin or verify.
    required: true
  base:
    description: >-
      The ref the pull request merges into (lanes, audit). Default:
      origin/<the pull request's base branch>. Needs the base in the
      checkout (actions/checkout with fetch-depth 0).
    required: false
    default: ''
  head:
    description: The ref under review (lanes, audit).
    required: false
    default: HEAD
  policy:
    description: The policy file, read from the base ref (lanes), or the file to hash (pin).
    required: false
    default: .referee.yml
  policy-sha256:
    description: The pinned sha256 of the policy file (pin).
    required: false
    default: ''
  fail-on:
    description: >-
      lanes: fail the step on human (default), second_opinion (also fails a
      second_opinion lane) or never (report only; read the lane output).
      audit: never reports findings without failing (read exit-code); any
      other value fails on findings. An error always fails.
    required: false
    default: human
  records:
    description: The JSONL record file (verify).
    required: false
    default: ''
  pubkey:
    description: The public key file (verify).
    required: false
    default: ''
  tree:
    description: Also require each record's tree to be this directory's tree now (verify).
    required: false
    default: ''
  key:
    description: >-
      lanes, audit: an ed25519 private key file (referee keygen). The step
      then also appends a signed referee record (this referee's version,
      commit and ruleset, the policy file's sha256 at the base, base and
      head, the verdict and the exit code) to `record`.
    required: false
    default: ''
  record:
    description: >-
      lanes, audit: the JSONL file the referee record is appended to (with
      `key`). Default: $RUNNER_TEMP/referee.jsonl.
    required: false
    default: ''
  require-referee:
    description: verify - true fails a record file with no referee record.
    required: false
    default: 'false'
  expect-referee-commit:
    description: verify - require referee records written by the referee built from this commit.
    required: false
    default: ''
  expect-ruleset:
    description: verify - require referee records judged with this ruleset version.
    required: false
    default: ''
  expect-exit:
    description: verify - require the last referee record's exit code to be this.
    required: false
    default: ''

outputs:
  lane:
    description: The lane (lanes mode) - auto, second_opinion or human.
    value: ${{ steps.referee.outputs.lane }}
  exit-code:
    description: referee's exit code.
    value: ${{ steps.referee.outputs.exit-code }}
  record:
    description: The referee record file (lanes, audit with `key`); upload it with the job's artifacts.
    value: ${{ steps.referee.outputs.record }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false
    - name: Build referee
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        GOFLAGS: -trimpath
        ACTION_REF: ${{ github.action_ref }}
      # The Action's own ref names the build in the referee record: a commit
      # SHA as main.commit (a tarball checkout has no vcs.revision).
      run: |
        ldflags=()
        if [[ "${ACTION_REF:-}" =~ ^[0-9a-f]{40}$ ]]; then
          ldflags=(-ldflags "-X main.commit=${ACTION_REF} -X main.version=action@${ACTION_REF:0:12}")
        elif [[ "${ACTION_REF:-}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          ldflags=(-ldflags "-X main.version=action@${ACTION_REF}")
        fi
        go install "${ldflags[@]}" ./cmd/referee
    - name: Run referee
      id: referee
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE: ${{ inputs.base }}
        HEAD_REF: ${{ inputs.head }}
        POLICY: ${{ inputs.policy }}
        POLICY_SHA256: ${{ inputs.policy-sha256 }}
        FAIL_ON: ${{ inputs.fail-on }}
        RECORDS: ${{ inputs.records }}
        PUBKEY: ${{ inputs.pubkey }}
        TREE: ${{ inputs.tree }}
        KEY: ${{ inputs.key }}
        RECORD: ${{ inputs.record }}
        REQUIRE_REFEREE: ${{ inputs.require-referee }}
        EXPECT_REFEREE_COMMIT: ${{ inputs.expect-referee-commit }}
        EXPECT_RULESET: ${{ inputs.expect-ruleset }}
        EXPECT_EXIT: ${{ inputs.expect-exit }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
